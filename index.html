<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Web Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 500px;
            max-width: 85%;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        h1 {
            color: #222;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .technology {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            background: #e8f0fe;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My DevOps Web Application</h1>

        <p>
            This web application is running inside a Docker container
            using Nginx.
        </p>

        <div>
            <span class="technology">Docker</span>
            <span class="technology">Nginx</span>
            <span class="technology">Git</span>
            <span class="technology">GitHub</span>
        </div>

        <p>
            <strong>Project:</strong>
            Docker Containerized Web Application
        </p>

    </div>

</body>
</html>
